/* ===== 初期データ ===== */
const INIT_HORSES=[];

const INIT_ADDRESSES={};

const CAT_P={"繁殖":5000,"一才":5000,"当歳":3000};
/* 馬齢計算（1月1日加齢） */
function horseAge(birthDate){if(!birthDate)return null;const by=new Date(birthDate).getFullYear();const now=new Date();return now.getFullYear()-by}
function horseAgeLabel(birthDate){const a=horseAge(birthDate);if(a===null)return"";if(a===0)return"当歳";return a+"歳"}
function dimM(y,m){return new Date(y,m,0).getDate()}
function calcD(en,ex,y,m){
  if(!en)return 0;const d=dimM(y,m),ms=new Date(y,m-1,1),me=new Date(y,m-1,d),e=new Date(en);
  if(e>me)return 0;if(ex){const x=new Date(ex);if(x<ms)return 0;return Math.max(0,Math.floor((Math.min(x,me)-Math.max(e,ms))/864e5)+1)}
  return Math.max(0,Math.floor((me-Math.max(e,ms))/864e5)+1);
}
function fmt(n){return Number(n||0).toLocaleString()}
/* 全角数字・カンマ・円記号を許容して数値化（IMEオンでも入力できるように） */
function numIn(v,fb){
  const s=String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[ー－―‐]/g,"-").replace(/[,，\s円￥¥]/g,"");
  if(s===""||s==="-")return 0;
  return /^-?\d+$/.test(s)?Number(s):(fb||0);
}
/* 離乳日で日割単価を分割（離乳日当日までは離乳前単価、翌日から通常単価） */
function segRange(y,m,fromD,toD){return `${m}/${fromD}〜${m}/${toD}`}
function weanSegs(h,y,m){
  const total=calcD(h.entry,h.exit,y,m);
  if(total<=0)return[];
  const dim=dimM(y,m);
  /* 離乳日だけ入っていれば、離乳前単価はカテゴリ標準を自動適用 */
  let pre=Number(h.preWeanPrice||0);
  if(h.weanDate&&!pre){const d=CAT_P[h.cat];if(d&&d<h.price)pre=d}
  if(!h.weanDate||!pre||pre===h.price)return[{days:total,price:h.price,sub:""}];
  let preEnd=h.weanDate;
  if(h.exit&&new Date(h.exit)<new Date(h.weanDate))preEnd=h.exit;
  const pd=calcD(h.entry,preEnd,y,m);
  const post=total-pd;
  if(pd<=0||post<=0)return[{days:total,price:pd>0?pre:h.price,sub:""}];
  const wd=new Date(h.weanDate);
  const cut=(wd.getFullYear()===y&&wd.getMonth()+1===m)?wd.getDate():dim;
  const startD=Math.max(1,dim-total+1);
  const segs=[];
  segs.push({days:pd,price:pre,sub:segRange(y,m,startD,cut)});
  segs.push({days:post,price:h.price,sub:segRange(y,m,cut+1,startD+total-1)});
  return segs;
}
function horseAmt(h,y,m){return weanSegs(h,y,m).reduce((s,g)=>s+g.days*g.price,0)}

function Badge({cat}){
  const c=cat==="繁殖"?"badge-b":cat==="一才"?"badge-y":cat==="当歳"?"badge-f":"badge-e";
  return <span className={`inline-block px-2 py-0.5 text-xs font-medium rounded-full ${c}`}>{cat}</span>;
}

function calcMonthInv(horses,extras,y,m){
  const om={};
  horses.forEach(h=>{const amt=horseAmt(h,y,m);if(amt>0){if(!om[h.owner])om[h.owner]=0;om[h.owner]+=amt+Math.floor(amt*0.1)}});
  const ek=`${y}-${m}`;(extras[ek]||[]).forEach(e=>{if(!om[e.owner])om[e.owner]=0;if(e.taxIncluded){om[e.owner]+=e.amount}else{om[e.owner]+=e.amount+Math.floor(e.amount*0.1)}});
  return om;
}
/* 月別請求額の詳細版（税額分離） */
function calcMonthDetail(horses,extras,y,m){
  const om={};
  horses.forEach(h=>{const amt=horseAmt(h,y,m);if(amt>0){if(!om[h.owner])om[h.owner]={taxEx:0,taxInc:0};om[h.owner].taxEx+=amt;}});
  const ek=`${y}-${m}`;(extras[ek]||[]).forEach(e=>{if(!om[e.owner])om[e.owner]={taxEx:0,taxInc:0};if(e.taxIncluded)om[e.owner].taxInc+=e.amount;else om[e.owner].taxEx+=e.amount;});
  const res={};
  Object.entries(om).forEach(([ow,v])=>{
    const tax=Math.floor(v.taxEx*0.1);
    const incTax=v.taxInc-Math.floor(v.taxInc/1.1);
    res[ow]={sub:v.taxEx,tax:tax,taxIncTotal:v.taxInc,total:v.taxEx+tax+v.taxInc,taxTotal:tax+Math.round(incTax)};
  });
  return res;
}

/* ===== 音声入力ボタン ===== */
function MicBtn({onText,label}){
  const SR=typeof window!=="undefined"&&(window.SpeechRecognition||window.webkitSpeechRecognition);
  const[rec,setRec]=useState(false);
  const ref=React.useRef(null);
  if(!SR)return null;
  const stop=()=>{try{ref.current&&ref.current.stop()}catch(e){}setRec(false)};
  const start=()=>{
    if(rec){stop();return}
    const r=new SR();
    r.lang="ja-JP";r.interimResults=false;r.continuous=false;r.maxAlternatives=1;
    r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join("");if(t)onText(t)};
    r.onerror=e=>{setRec(false);if(e.error==="not-allowed")alert("マイクの使用が許可されていません。ブラウザの設定で許可してください。")};
    r.onend=()=>setRec(false);
    ref.current=r;
    try{r.start();setRec(true)}catch(e){setRec(false)}
  };
  return<button type="button" className="no-print" onClick={start} title={label||"音声入力"}
    style={{border:"1px solid "+(rec?"#dc2626":"#d1d5db"),background:rec?"#fee2e2":"#fff",color:rec?"#dc2626":"#6b7280",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap",lineHeight:1.6}}>
    {rec?"● 録音中 停止":"🎤 音声入力"}
  </button>;
}

/* 画像を縮小して保存容量を抑える（領収書写真の肥大化対策） */
function shrinkImg(dataUrl,maxPx,quality){
  return new Promise(function(res){
    try{
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,r=Math.min(1,maxPx/Math.max(w,h));
        var c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",quality||0.7));
      };
      img.onerror=function(){res(dataUrl)};
      img.src=dataUrl;
    }catch(e){res(dataUrl)}
  });
}

/* 指定年月の請求データを生成（画面表示・集計・一括印刷で共用） */
function buildInvoices(horses,extras,paidFlags,y,m){
  const om={};
  const eH=horses.filter(h=>!h.selfOwned&&!h.isShared);
  eH.forEach(h=>{
    const segs=weanSegs(h,y,m);
    if(segs.length){if(!om[h.owner])om[h.owner]=[];segs.forEach((g,gi)=>om[h.owner].push({name:h.name,sub:g.sub||"",cont:gi>0,cat:h.cat,days:g.days,price:g.price,amount:g.days*g.price,qty:g.days+" 日",unitPrice:g.price,taxIncluded:false,isExtra:false}))}
  });
  const ek=`${y}-${m}`;
  (extras[ek]||[]).forEach(e=>{if(!om[e.owner])om[e.owner]=[];om[e.owner].push({name:e.description,cat:"追加",days:0,price:0,amount:e.amount,qty:"1",unitPrice:e.taxIncluded?Math.floor(e.amount/1.1):e.amount,taxIncluded:e.taxIncluded,isExtra:true,isAdvance:!!e.isAdvance})});
  return Object.entries(om).sort(([a],[b])=>a.localeCompare(b)).map(([owner,items])=>{
    const taxable=items.filter(i=>!i.taxIncluded).reduce((s,i)=>s+i.amount,0);
    const taxOnTaxable=Math.floor(taxable*0.1);
    const taxIncTotal=items.filter(i=>i.taxIncluded).reduce((s,i)=>s+i.amount,0);
    const taxIncBase=items.filter(i=>i.taxIncluded).reduce((s,i)=>s+Math.floor(i.amount/1.1),0);
    const total=taxable+taxOnTaxable+taxIncTotal;
    let carry=0;
    for(let i=1;i<=12;i++){let py=y,pm=m-i;if(pm<=0){pm+=12;py--}const pKey=`${py}-${pm}`;const pInv=calcMonthInv(eH,extras,py,pm);if(pInv[owner]&&!(paidFlags[pKey]&&paidFlags[pKey][owner]))carry+=pInv[owner]}
    const paid=!!(paidFlags[`${y}-${m}`]&&paidFlags[`${y}-${m}`][owner]);
    return{owner,items,taxable,taxOnTaxable,taxIncTotal,taxIncBase,total,carry,paid,netBase:taxable+taxIncBase,taxTotal:taxOnTaxable+(taxIncTotal-taxIncBase)};
  });
}

/* クラウド同期フック：各データを別ドキュメントに保存し、変わったものだけ送る */
function useFarmSync(state,setters,user){
  const[st,setSt]=useState({phase:"connecting",pending:false,lastSync:null,error:null,online:navigator.onLine,backupAt:null,lastBy:null});
  const up=useCallback(p=>setSt(s=>({...s,...p})),[]);
  const R=React.useRef({got:{},srv:{},remote:{},months:{},rcpt:{},pend:{},timer:null,backupDone:false});
  const stRef=React.useRef(state);stRef.current=state;
  const phaseRef=React.useRef("connecting");
  const setPhase=p=>{phaseRef.current=p;up({phase:p})};

  const checkReady=useCallback(()=>{
    const r=R.current;
    if(phaseRef.current==="error")return;
    const trusted=!!r.remote.horses;
    const dataOk=r.got.data&&(r.srv.data||trusted);
    const extOk=r.got.ext&&(r.srv.ext||trusted);
    const rcOk=r.got.rcpt&&(r.srv.rcpt||trusted);
    if(!(dataOk&&extOk&&rcOk))return;
    setPhase(trusted?"synced":"empty");
  },[]);

  /* 受信 */
  useEffect(()=>{
    if(!fbDb||!user)return;
    const r=R.current;const uns=[];
    const onErr=e=>{console.error(e);phaseRef.current="error";up({phase:"error",error:fbErrMsg(e)})};
    const meta=(name,snap)=>{
      r.pend[name]=snap.metadata.hasPendingWrites;
      const pending=!!(r.pend.data||r.pend.ext||r.pend.rcpt);
      const p={pending};
      if(!snap.metadata.fromCache&&!pending)p.lastSync=Date.now();
      up(p);
    };
    uns.push(fbDb.collection(COL_DATA).onSnapshot({includeMetadataChanges:true},snap=>{
      snap.docChanges().forEach(ch=>{
        const k=ch.doc.id;if(!SYNC_KEYS.includes(k))return;
        if(ch.type==="removed"){delete r.remote[k];return}
        const d=ch.doc.data()||{};
        if(d.json===r.remote[k])return;
        r.remote[k]=d.json;
        try{setters[k](JSON.parse(d.json))}catch(e){console.error(e)}
        if(k==="horses"&&d.by)up({lastBy:d.by+" "+(d.at?new Date(d.at).toLocaleString("ja-JP"):"")});
      });
      r.got.data=true;if(!snap.metadata.fromCache)r.srv.data=true;
      meta("data",snap);checkReady();
    },onErr));
    const rebuild=()=>{r.extDirty=true;if(r.got.ext&&r.got.rcpt){r.extDirty=false;setters.extras(mergeExtras(r.months,r.rcpt))}};
    uns.push(fbDb.collection(COL_EXT).onSnapshot({includeMetadataChanges:true},snap=>{
      let changed=false;
      snap.docChanges().forEach(ch=>{
        const ym=ch.doc.id;
        if(ch.type==="removed"){if(ym in r.months){delete r.months[ym];changed=true}return}
        const j=(ch.doc.data()||{}).json;
        if(j!==r.months[ym]){r.months[ym]=j;changed=true}
      });
      r.got.ext=true;if(!snap.metadata.fromCache)r.srv.ext=true;
      if(changed||(r.extDirty&&r.got.ext&&r.got.rcpt))rebuild();
      meta("ext",snap);checkReady();
    },onErr));
    uns.push(fbDb.collection(COL_RCPT).onSnapshot({includeMetadataChanges:true},snap=>{
      let changed=false;
      snap.docChanges().forEach(ch=>{
        const id=ch.doc.id;
        if(ch.type==="removed"){if(id in r.rcpt){delete r.rcpt[id];changed=true}return}
        const img=(ch.doc.data()||{}).img;
        if(img!==r.rcpt[id]){r.rcpt[id]=img;changed=true}
      });
      r.got.rcpt=true;if(!snap.metadata.fromCache)r.srv.rcpt=true;
      if(changed||(r.extDirty&&r.got.ext&&r.got.rcpt))rebuild();
      meta("rcpt",snap);checkReady();
    },onErr));
    const on=()=>up({online:true}),off=()=>up({online:false});
    window.addEventListener("online",on);window.addEventListener("offline",off);
    return()=>{uns.forEach(u=>{try{u()}catch(e){}});window.removeEventListener("online",on);window.removeEventListener("offline",off)};
  },[user]);

  /* 送信（変わったドキュメントだけ） */
  const flush=useCallback(async()=>{
    const r=R.current;if(!fbDb||phaseRef.current!=="synced")return;
    const s=stRef.current;const at=Date.now(),by=devLabel()+" "+((user&&user.email)||"");
    const ops=[];
    for(const k of SYNC_KEYS){
      const j=JSON.stringify(s[k]===undefined?null:s[k]);
      if(j===r.remote[k])continue;
      if(k==="horses"&&r.remote.horses){
        let oldN=0;try{oldN=(JSON.parse(r.remote.horses)||[]).length}catch(e){}
        const newN=(s.horses||[]).length;
        if(oldN-newN>=3&&!confirm("馬の登録が "+oldN+" 頭 → "+newN+" 頭 に減ります。\nクラウドのデータもこの内容で上書きしますか？\n\n「キャンセル」でクラウドの内容に戻します。")){
          try{setters.horses(JSON.parse(r.remote.horses))}catch(e){}
          continue;
        }
      }
      r.remote[k]=j;
      ops.push(b=>b.set(fbDb.collection(COL_DATA).doc(k),{json:j,at,by}));
    }
    const sp=splitExtras(s.extras);
    Object.entries(sp.months).forEach(([ym,j])=>{
      if(j===r.months[ym])return;r.months[ym]=j;
      ops.push(b=>b.set(fbDb.collection(COL_EXT).doc(ym),{json:j,at,by}));
    });
    Object.keys(r.months).forEach(ym=>{
      if(ym in sp.months)return;delete r.months[ym];
      ops.push(b=>b.delete(fbDb.collection(COL_EXT).doc(ym)));
    });
    const bigFix=[];
    for(const [id,img] of Object.entries(sp.rcpt)){
      if(img===r.rcpt[id])continue;
      if(img.length>MAX_DOC){bigFix.push(id);continue}
      r.rcpt[id]=img;
      ops.push(b=>b.set(fbDb.collection(COL_RCPT).doc(id),{img,at,by}));
    }
    Object.keys(r.rcpt).forEach(id=>{
      if(id in sp.rcpt)return;delete r.rcpt[id];
      ops.push(b=>b.delete(fbDb.collection(COL_RCPT).doc(id)));
    });
    /* 大きすぎる領収書写真は縮小してから送る（次回の送信で反映） */
    if(bigFix.length){
      for(const id of bigFix){
        let img=sp.rcpt[id];
        for(const [px,q] of [[1000,0.6],[800,0.5],[600,0.45]]){if(img.length<=MAX_DOC)break;img=await shrinkImg(img,px,q)}
        const [ym,eid]=id.split("__");
        setters.extras(prev=>{const n={...prev};n[ym]=(n[ym]||[]).map(e=>String(e.id)===eid?{...e,receiptImg:img}:e);return n});
      }
    }
    for(let i=0;i<ops.length;i+=20){
      const b=fbDb.batch();ops.slice(i,i+20).forEach(f=>f(b));
      b.commit().catch(e=>{console.error(e);phaseRef.current="error";up({phase:"error",error:fbErrMsg(e)})});
    }
  },[user]);

  useEffect(()=>{
    const r=R.current;if(!fbDb||!user||st.phase!=="synced")return;
    if(r.timer)clearTimeout(r.timer);
    r.timer=setTimeout(flush,800);
  },[st.phase,state.horses,state.addrs,state.extras,state.paidFlags,state.invNotes,state.selfCosts,state.selfSales,state.advCosts,state.insurances]);

  /* 1日1回の自動バックアップ（写真を除く・7世代） */
  useEffect(()=>{
    const r=R.current;if(!fbDb||st.phase!=="synced"||r.backupDone||!st.lastSync)return;
    r.backupDone=true;
    const id=todayStr();const col=fbDb.collection(COL_BK);
    col.doc(id).get().then(d=>{
      if(d.exists){up({backupAt:id});return}
      const s=stRef.current;const sp=splitExtras(s.extras);
      const body={};SYNC_KEYS.forEach(k=>body[k]=s[k]);
      body.extras={};Object.entries(sp.months).forEach(([ym,j])=>{try{body.extras[ym]=JSON.parse(j)}catch(e){}});
      return col.doc(id).set({json:JSON.stringify(body),at:Date.now(),by:devLabel(),n:(s.horses||[]).length}).then(()=>{
        up({backupAt:id});
        return col.get().then(q=>{const ids=q.docs.map(x=>x.id).sort().reverse();ids.slice(7).forEach(x=>col.doc(x).delete())});
      });
    }).catch(e=>console.warn("backup",e));
  },[st.phase,st.lastSync]);

  /* 初回アップロード（クラウドが空のときだけ） */
  const uploadAll=useCallback(()=>{
    const r=R.current;if(!fbDb||phaseRef.current!=="empty")return;
    const s=stRef.current;
    if(!(s.horses||[]).length){alert("この端末に馬のデータがありません。先にバックアップ復元をしてください。");return}
    if(!confirm("この端末のデータ（馬 "+s.horses.length+" 頭）をクラウドへ初回アップロードします。\n以後はほかの端末もこのデータで同期されます。よろしいですか？"))return;
    const at=Date.now(),by=devLabel()+" "+((user&&user.email)||"");
    const ops=[];
    SYNC_KEYS.forEach(k=>{const j=JSON.stringify(s[k]===undefined?null:s[k]);r.remote[k]=j;ops.push(b=>b.set(fbDb.collection(COL_DATA).doc(k),{json:j,at,by}))});
    const sp=splitExtras(s.extras);
    Object.entries(sp.months).forEach(([ym,j])=>{r.months[ym]=j;ops.push(b=>b.set(fbDb.collection(COL_EXT).doc(ym),{json:j,at,by}))});
    Object.entries(sp.rcpt).forEach(([id,img])=>{if(img.length>MAX_DOC)return;r.rcpt[id]=img;ops.push(b=>b.set(fbDb.collection(COL_RCPT).doc(id),{img,at,by}))});
    for(let i=0;i<ops.length;i+=20){const b=fbDb.batch();ops.slice(i,i+20).forEach(f=>f(b));b.commit().catch(e=>{phaseRef.current="error";up({phase:"error",error:fbErrMsg(e)})})}
    setPhase("synced");
  },[user]);

  const listBackups=useCallback(()=>fbDb?fbDb.collection(COL_BK).get().then(q=>q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.id.localeCompare(a.id))):Promise.resolve([]),[]);
  return{...st,uploadAll,listBackups,flushNow:flush};
}

  const sortFn=useCallback((arr)=>{

              <th style={{padding:"9px 12px",textAlign:"left",fontSize:11,color:"#6b7280",cursor:"pointer"}} onClick={()=>shSort("name")}>馬名{shSortKey==="name"?(shSortAsc?" ▲":" ▼"):""}</th>
              <th style={{padding:"9px 12px",textAlign:"center",fontSize:11,color:"#6b7280",cursor:"pointer"}} onClick={()=>shSort("cat")}>区分{shSortKey==="cat"?(shSortAsc?" ▲":" ▼"):""}</th>
              <th style={{padding:"9px 12px",textAlign:"left",fontSize:11,color:"#6b7280",cursor:"pointer"}} onClick={()=>shSort("sire")}>父馬{shSortKey==="sire"?(shSortAsc?" ▲":" ▼"):""}</th>
              <th style={{padding:"9px 12px",textAlign:"right",fontSize:11,color:"#6b7280",cursor:"pointer"}} onClick={()=>shSort("cost")}>原価{shSortKey==="cost"?(shSortAsc?" ▲":" ▼"):""}</th>
              <th style={{padding:"9px 12px",textAlign:"right",fontSize:11,color:"#6b7280",cursor:"pointer"}} onClick={()=>shSort("sale")}>売却額{shSortKey==="sale"?(shSortAsc?" ▲":" ▼"):""}</th>
              <th style={{padding:"9px 12px",textAlign:"right",fontSize:11,color:"#6b7280",cursor:"pointer"}} onClick={()=>shSort("profit")}>損益{shSortKey==="profit"?(shSortAsc?" ▲":" ▼"):""}</th>
              <th style={{padding:"9px 12px",textAlign:"right",fontSize:11,color:"#6b7280"}}></th>
            </tr></thead>
            <tbody>
              {allOwnH.map(h=>{
                const costs=selfCosts[h.id]||[];
                const costTotal=costs.reduce((s,c)=>s+c.amount,0);
                const sale=selfSales[h.id];
                const profit=sale?(sale.amount-costTotal):null;
                const open=shOpen===h.id;
                return<React.Fragment key={h.id}>
                  <tr style={{borderTop:"1px solid #f3f4f6",cursor:"pointer",background:open?"#f9fafb":"transparent"}} onClick={()=>setShOpen(open?null:h.id)}>
                    <td style={{padding:"9px 12px"}}>
                      <span style={{color:"#9ca3af",marginRight:6,fontSize:11}}>{open?"▾":"▸"}</span>
                      <span style={{fontWeight:500}}>{h.name}</span>
                                            {h.isShared&&<span style={{fontSize:10,color:"#1e40af",background:"#dbeafe",padding:"1px 6px",borderRadius:4,marginLeft:6}}>共有{h.shareRatio||50}%</span>}
                    </td>
                    <td style={{padding:"9px 12px",textAlign:"center"}}><Badge cat={h.cat}/></td>
                    <td style={{padding:"9px 12px",color:"#6b7280",fontSize:12}}>{h.sire||"—"}</td>
                    <td style={{padding:"9px 12px",textAlign:"right",color:costTotal?"#dc2626":"#d1d5db"}}>{costTotal?"¥"+fmt(costTotal):"—"}</td>
                    <td style={{padding:"9px 12px",textAlign:"right",color:sale?"#059669":"#9ca3af",fontWeight:sale?600:400}}>{sale?"¥"+fmt(sale.amount):"未売却"}</td>
                    <td style={{padding:"9px 12px",textAlign:"right",fontWeight:600,color:profit===null?"#d1d5db":profit>=0?"#059669":"#dc2626"}}>{profit===null?"—":(profit>=0?"+":"")+"¥"+fmt(profit)}</td>
                    <td style={{padding:"9px 12px",textAlign:"right",whiteSpace:"nowrap"}}>
                      <button style={{background:"#059669",color:"#fff",padding:"4px 10px",borderRadius:6,fontSize:11,border:"none",cursor:"pointer"}} onClick={e=>{e.stopPropagation();setSsModal(h.id)}}>{sale?"売却編集":"売却登録"}</button>
                    </td>
                  </tr>
                  {open&&<tr style={{background:"#f9fafb"}}><td colSpan={7} style={{padding:"0 12px 12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0"}}>
                      <span style={{fontSize:12,color:"#6b7280"}}>入厩 {h.entry}{h.exit?` → 退厩 ${h.exit}`:""}{h.isShared&&h.coOwner?`　共有相手 ${h.coOwner}`:""}</span>
                      <button style={{background:"#7c3aed",color:"#fff",padding:"4px 12px",borderRadius:6,fontSize:11,border:"none",cursor:"pointer"}} onClick={()=>setScModal(h.id)}>+ 原価追加</button>
                    </div>
                    {costs.length>0?<table style={{width:"100%",fontSize:12,background:"#fff",borderRadius:6,borderCollapse:"collapse"}}><tbody>
                      {costs.map(c=><tr key={c.id} style={{borderBottom:"1px solid #f3f4f6"}}>
                        <td style={{padding:"5px 10px"}}><span style={{background:"#ede9fe",color:"#5b21b6",padding:"1px 6px",borderRadius:4,fontSize:10,marginRight:6}}>{c.type}</span>{c.desc}</td>
                        <td style={{padding:"5px 10px",textAlign:"right",whiteSpace:"nowrap"}}>¥{fmt(c.amount)}</td>
                        <td style={{padding:"5px 10px",color:"#9ca3af",whiteSpace:"nowrap"}}>{c.date}</td>
                        <td style={{padding:"5px 10px",width:40}}><button style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontSize:11}} onClick={()=>{const n={...selfCosts};n[h.id]=n[h.id].filter(x=>x.id!==c.id);setSelfCosts(n)}}>削除</button></td>
                      </tr>)}
                    </tbody></table>:<p style={{fontSize:12,color:"#9ca3af",margin:"4px 0"}}>原価が登録されていません。</p>}
                    {sale&&<div style={{background:"#f0fdf4",borderRadius:6,padding:"7px 12px",fontSize:12,marginTop:8}}>売却 <b>¥{fmt(sale.amount)}</b>（税抜）　{sale.sale||sale.venue}　{sale.date}{sale.memo?` / ${sale.memo}`:""}</div>}
                  </td></tr>}
                </React.Fragment>
              })}
            </tbody></table>
        </div>
        {allOwnH.length>0&&<div style={{background:"#f3f4f6",borderRadius:12,padding:16,display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:16}}>
          <span style={{fontSize:14,color:"#4b5563"}}>自己馬 {selfH.length}頭 / 共有馬 {sharedH.length}頭</span>
          <div style={{textAlign:"right"}}><p style={{fontSize:14,margin:0}}>原価合計: <span style={{color:"#dc2626",fontWeight:"bold"}}>¥{fmt(totalCostAll)}</span></p><p style={{fontSize:14,margin:0}}>売上合計: <span style={{color:"#059669",fontWeight:"bold"}}>¥{fmt(totalSalesAll)}</span></p><p style={{fontSize:16,fontWeight:"bold",margin:"4px 0 0",color:totalSalesAll-totalCostAll>=0?"#059669":"#dc2626"}}>損益: {totalSalesAll-totalCostAll>=0?"+":""}¥{fmt(totalSalesAll-totalCostAll)}</p></div>
        </div>}

        {/* ===== 保険加入管理 ===== */}
        <div style={{marginTop:24}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <h2 style={{fontSize:16,fontWeight:"bold",margin:0}}>保険加入管理</h2>
            <button style={{background:"#2563eb",color:"#fff",padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:600,border:"none",cursor:"pointer"}} onClick={()=>setInsModal(true)}>+ 保険登録</button>
          </div>
          {(()=>{
            const now=new Date();
            const soon=new Date(now.getTime()+30*24*60*60*1000);
            const active=insurances.filter(ins=>{if(!ins.endDate)return true;return new Date(ins.endDate)>=now});
            const expired=insurances.filter(ins=>ins.endDate&&new Date(ins.endDate)<now);
            const totalPremium=active.reduce((s,ins)=>s+ins.premium,0);
            return<>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
              <div className="bg-white rounded-xl p-4" style={{border:"1px solid #e5e7eb"}}><p style={{fontSize:12,color:"#6b7280",marginBottom:4}}>加入中</p><p style={{fontSize:24,fontWeight:"bold",color:"#2563eb",margin:0}}>{active.length}件</p></div>
              <div className="bg-white rounded-xl p-4" style={{border:"1px solid #e5e7eb"}}><p style={{fontSize:12,color:"#6b7280",marginBottom:4}}>保険料合計</p><p style={{fontSize:20,fontWeight:"bold",color:"#dc2626",margin:0}}>¥{fmt(totalPremium)}</p></div>
              <div className="bg-white rounded-xl p-4" style={{border:"1px solid #e5e7eb"}}><p style={{fontSize:12,color:"#6b7280",marginBottom:4}}>期限切れ</p><p style={{fontSize:24,fontWeight:"bold",color:"#9ca3af",margin:0}}>{expired.length}件</p></div>
            </div>
            {active.length>0&&<div className="bg-white rounded-xl" style={{border:"1px solid #e5e7eb",overflow:"auto",marginBottom:16}}>
              <table className="w-full" style={{fontSize:12}}><thead style={{background:"#f9fafb",borderBottom:"1px solid #e5e7eb"}}><tr>
                <th style={{padding:"8px 12px",textAlign:"left"}}>馬名</th>
                <th style={{padding:"8px 12px",textAlign:"left"}}>馬主</th>
                <th style={{padding:"8px 12px",textAlign:"left"}}>保険会社</th>
                <th style={{padding:"8px 12px",textAlign:"left"}}>証券番号</th>
                <th style={{padding:"8px 12px",textAlign:"left"}}>補償内容</th>
                <th style={{padding:"8px 12px",textAlign:"right"}}>保険料</th>
                <th style={{padding:"8px 12px",textAlign:"center"}}>期間</th>
                <th style={{padding:"8px 12px",textAlign:"center"}}>状態</th>
                <th style={{padding:"8px 12px"}}></th>
              </tr></thead>
              <tbody>{active.map(ins=>{
                const h=horses.find(x=>x.id===ins.horseId);
                const expiring=ins.endDate&&new Date(ins.endDate)<=soon;
                return<tr key={ins.id} style={{borderBottom:"1px solid #f3f4f6",background:expiring?"#fef3c7":"transparent"}}>
                  <td style={{padding:"8px 12px",fontWeight:500}}>{h?h.name:"（削除済）"}</td>
                  <td style={{padding:"8px 12px",color:"#6b7280"}}>{h?h.owner:"—"}</td>
                  <td style={{padding:"8px 12px"}}>{ins.company}</td>
                  <td style={{padding:"8px 12px",fontFamily:"monospace",fontSize:11}}>{ins.policyNo||"—"}</td>
                  <td style={{padding:"8px 12px",fontSize:11}}>{ins.coverage||"—"}</td>
                  <td style={{padding:"8px 12px",textAlign:"right",fontWeight:600}}>¥{fmt(ins.premium)}</td>
                  <td style={{padding:"8px 12px",textAlign:"center",fontSize:11}}>{ins.startDate}〜{ins.endDate||"未定"}</td>
                  <td style={{padding:"8px 12px",textAlign:"center"}}>{expiring?<span style={{background:"#fbbf24",color:"#78350f",padding:"1px 6px",borderRadius:4,fontSize:10,fontWeight:600}}>更新間近</span>:<span style={{background:"#d1fae5",color:"#065f46",padding:"1px 6px",borderRadius:4,fontSize:10}}>有効</span>}</td>
                  <td style={{padding:"8px 12px"}}><button style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontSize:11}} onClick={()=>setInsurances(p=>p.filter(x=>x.id!==ins.id))}>削除</button></td>
                </tr>})}</tbody></table>
            </div>}
            {expired.length>0&&<details style={{marginBottom:16}}>
              <summary style={{fontSize:13,color:"#6b7280",cursor:"pointer",marginBottom:8}}>期限切れの保険（{expired.length}件）</summary>
              <div className="bg-white rounded-xl" style={{border:"1px solid #e5e7eb",overflow:"auto"}}>
                <table className="w-full" style={{fontSize:12}}><tbody>{expired.map(ins=>{
                  const h=horses.find(x=>x.id===ins.horseId);
                  return<tr key={ins.id} style={{borderBottom:"1px solid #f3f4f6",opacity:0.6}}>
                    <td style={{padding:"8px 12px"}}>{h?h.name:"—"}</td>
                    <td style={{padding:"8px 12px"}}>{ins.company}</td>
                    <td style={{padding:"8px 12px",fontSize:11}}>{ins.policyNo||""}</td>
                    <td style={{padding:"8px 12px",textAlign:"right"}}>¥{fmt(ins.premium)}</td>
                    <td style={{padding:"8px 12px",textAlign:"center",fontSize:11}}>{ins.startDate}〜{ins.endDate}</td>
                    <td style={{padding:"8px 12px"}}><button style={{color:"#ef4444",background:"none",border:"none",cursor:"pointer",fontSize:11}} onClick={()=>setInsurances(p=>p.filter(x=>x.id!==ins.id))}>削除</button></td>
                  </tr>})}</tbody></table>
              </div>
            </details>}
            {insurances.length===0&&<div className="bg-white rounded-xl p-8" style={{border:"1px solid #e5e7eb",textAlign:"center"}}><p style={{color:"#9ca3af",fontSize:14}}>保険が登録されていません</p></div>}
            </>
          })()}
        </div>
      </div>})()}

      {/* ===== 住所録 ===== */}
      {tab==="address"&&<div>
        <div className="bg-white rounded-xl" style={{border:"1px solid #e5e7eb",overflow:"auto"}}>
          <table className="w-full"><thead style={{background:"#f9fafb",borderBottom:"1px solid #e5e7eb"}}><tr>{["馬主","郵便番号","住所","",""].map((h,i)=><th key={i} style={{padding:"12px 16px",fontSize:11,fontWeight:600,color:"#6b7280",textAlign:"left"}}>{h}</th>)}</tr></thead>
          <tbody>{owners.map(ow=>{const a=addrs[ow]||{};return<tr key={ow} style={{borderBottom:"1px solid #f3f4f6"}}>
            <td style={{padding:"12px 16px",fontSize:14,fontWeight:500}}>{ow}</td>
            <td style={{padding:"12px 16px",fontSize:14}}>〒{a.zip||"未登録"}</td>
            <td style={{padding:"12px 16px",fontSize:14}}>{a.address1||""}{a.address2?` ${a.address2}`:""}</td>
            <td style={{padding:"12px 16px"}}><button style={{fontSize:12,color:"#2563eb",background:"none",border:"none",cursor:"pointer"}} onClick={()=>{setEditAddr(ow);setAddrForm(a.zip?{...a}:{zip:"",address1:"",address2:""})}}>編集</button></td>
            <td style={{padding:"12px 16px"}}>{a.zip&&<button style={{fontSize:12,color:"#059669",background:"none",border:"none",cursor:"pointer"}} onClick={()=>setEnvPrev({...a,name:ow})}>封筒</button>}</td>
          </tr>})}</tbody></table>
        </div>
        {editAddr&&<div className="modal-overlay" onClick={()=>setEditAddr(null)}><div className="bg-white rounded-xl shadow-2xl p-6 w-full" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
          <h3 className="text-lg font-bold mb-4">{editAddr} の住所編集</h3>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">郵便番号</label><div style={{display:"flex",gap:8}}><input className="flex-1 border rounded-lg px-3 py-2 text-sm" placeholder="例: 0560144" value={addrForm.zip} onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,"");setAddrForm(p=>({...p,zip:v}));if(v.length===7){fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${v}`).then(r=>r.json()).then(d=>{if(d.results&&d.results[0]){const r=d.results[0];setAddrForm(p=>({...p,address1:r.address1+r.address2+r.address3}))}}).catch(()=>{})}
              }}/><button type="button" style={{background:"#2563eb",color:"#fff",padding:"4px 12px",borderRadius:6,fontSize:12,border:"none",cursor:"pointer",whiteSpace:"nowrap"}} onClick={()=>{const v=addrForm.zip;if(v.length===7){fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${v}`).then(r=>r.json()).then(d=>{if(d.results&&d.results[0]){const r=d.results[0];setAddrForm(p=>({...p,address1:r.address1+r.address2+r.address3}))}}).catch(()=>{})}}}>住所検索</button></div></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">住所1</label><input className="w-full border rounded-lg px-3 py-2 text-sm" value={addrForm.address1} onChange={e=>setAddrForm(p=>({...p,address1:e.target.value}))}/></div>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">住所2</label><input className="w-full border rounded-lg px-3 py-2 text-sm" value={addrForm.address2} onChange={e=>setAddrForm(p=>({...p,address2:e.target.value}))}/></div>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:24}}>
            <button className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg" onClick={()=>setEditAddr(null)}>キャンセル</button>
            <button className="px-4 py-2 text-sm text-white rounded-lg" style={{background:"#2563eb"}} onClick={()=>{setAddrs(p=>({...p,[editAddr]:{...addrForm}}));setEditAddr(null)}}>保存</button>
          </div>
        </div></div>}
      </div>}

    </main>

    {modal&&<HorseModal horse={modal==="new"?null:modal} owners={owners} onSave={save} onClose={()=>setModal(null)}/>}
    {extraModal&&<ExtraModal owners={owners} extras={extras} onSave={setExtras} onClose={()=>setExtraModal(false)} year={iY} month={iM}/>}
    {invPrev&&<InvPreview owner={invPrev.owner} items={invPrev.items} year={iY} month={iM} carry={invPrev.carry||0} onClose={()=>setInvPrev(null)} note={invNotes[`${iY}-${iM}-${invPrev.owner}`]||""} onNoteChange={v=>{const k=`${iY}-${iM}-${invPrev.owner}`;setInvNotes(p=>({...p,[k]:v}))}}/>}
    {envPrev&&<EnvelopePreview addr={envPrev} onClose={()=>setEnvPrev(null)}/>}
    {scModal&&(()=>{const h=horses.find(x=>x.id===scModal);return h?<CostModal horseId={h.id} horseName={h.name} onSave={(hid,cost)=>{const n={...selfCosts};if(!n[hid])n[hid]=[];n[hid]=[...n[hid],cost];setSelfCosts(n)}} onClose={()=>setScModal(null)}/>:null})()}
    {ssModal&&(()=>{const h=horses.find(x=>x.id===ssModal);return h?<SaleModal horseId={h.id} horseName={h.name} share={h.isShared?h:null} curExit={h.exit||""} existing={selfSales[h.id]||null} onSave={(hid,sale)=>{const n={...selfSales};if(sale){n[hid]=sale}else{delete n[hid]}setSelfSales(n);setH(hs=>hs.map(x=>x.id===hid?{...x,exit:sale?(sale.exit||x.exit||""):x.exit}:x))}} onClose={()=>setSsModal(null)}/>:null})()}
    {acModal&&(()=>{const h=horses.find(x=>x.id===acModal);if(!h)return null;
      const ACTypes=["種付け料","保険料","獣医療費","輸送費"];
      return<div className="modal-overlay" onClick={()=>setAcModal(null)}><div className="bg-white rounded-xl shadow-2xl p-6 w-full" style={{maxWidth:440}} onClick={e=>e.stopPropagation()}>
        <h3 className="text-lg font-bold mb-2">立替経費を追加</h3>
        <p style={{fontSize:13,color:"#6b7280",margin:"0 0 12px"}}>馬名: <strong>{h.name}</strong>（馬主: {h.owner}）</p>
        {(()=>{
          const[acf,setAcf]=React.useState({type:"種付け料",desc:"",amount:0,date:new Date().toISOString().slice(0,10),customType:""});
          const aUp=(k,v)=>setAcf(p=>({...p,[k]:v}));
          return<div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div><label className="block text-sm font-medium text-gray-700 mb-1">種類</label>
              <select className="w-full border rounded-lg px-3 py-2 text-sm" value={acf.type} onChange={e=>aUp("type",e.target.value)}>
                {ACTypes.map(t=><option key={t}>{t}</option>)}<option value="__custom">その他（自由入力）</option>
              </select>
            </div>
            {acf.type==="__custom"&&<div><label className="block text-sm font-medium text-gray-700 mb-1">種類名</label><input className="w-full border rounded-lg px-3 py-2 text-sm" value={acf.customType} onChange={e=>aUp("customType",e.target.value)}/></div>}
            <div><label className="block text-sm font-medium text-gray-700 mb-1">内容</label><input className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="例: ○○号種付け" value={acf.desc} onChange={e=>aUp("desc",e.target.value)}/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div><label className="block text-sm font-medium text-gray-700 mb-1">金額 (円)</label><input type="text" inputMode="numeric" className="w-full border rounded-lg px-3 py-2 text-sm" value={acf.amount} onChange={e=>{const v=e.target.value;aUp("amount",numIn(v,acf.amount))}}/></div>
              <div><label className="block text-sm font-medium text-gray-700 mb-1">日付</label><input type="date" className="w-full border rounded-lg px-3 py-2 text-sm" value={acf.date} onChange={e=>aUp("date",e.target.value)}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
              <button className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg" onClick={()=>setAcModal(null)}>キャンセル</button>
              <button className="px-4 py-2 text-sm text-white rounded-lg" style={{background:acf.amount>0?"#2563eb":"#9ca3af"}} disabled={acf.amount<=0} onClick={()=>{
                const typeName=acf.type==="__custom"?acf.customType:acf.type;
                const cost={id:Date.now(),type:typeName,desc:acf.desc,amount:acf.amount,date:acf.date};
                const n={...advCosts};if(!n[h.id])n[h.id]=[];n[h.id]=[...n[h.id],cost];setAdvCosts(n);setAcModal(null);
              }}>追加</button>
            </div>
          </div>
        })()}
      </div></div>
    })()}
    {insModal&&<InsuranceModal horses={horses} onSave={ins=>setInsurances(p=>[...p,{...ins,id:Date.now()}])} onClose={()=>setInsModal(false)}/>}
  </div>);
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
</body>
</html>
