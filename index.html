/* ===== 初期データ ===== */
const INIT_HORSES=[];

const INIT_ADDRESSES={};

const CAT_P={"繁殖":5000,"一才":5000,"当歳":3000};
/* 馬齢計算（1月1日加齢） */
function horseAge(birthDate){if(!birthDate)return null;const by=new Date(birthDate).getFullYear();const now=new Date();return now.getFullYear()-by}
function horseAgeLabel(birthDate){const a=horseAge(birthDate);if(a===null)return"";if(a===0)return"当歳";return a+"歳"}
function dimM(y,m){return new Date(y,m,0).getDate()}
function calcD(en,ex,y,m){
  if(!en)return 0;const d=dimM(y,m),ms=new Date(y,m-1,1),me=new Date(y,m-1,d),e=new Date(en);
  if(e>me)return 0;if(ex){const x=new Date(ex);if(x<ms)return 0;return Math.max(0,Math.floor((Math.min(x,me)-Math.max(e,ms))/864e5)+1)}
  return Math.max(0,Math.floor((me-Math.max(e,ms))/864e5)+1);
}
function fmt(n){return Number(n||0).toLocaleString()}
/* 全角数字・カンマ・円記号を許容して数値化（IMEオンでも入力できるように） */
function numIn(v,fb){
  const s=String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[ー－―‐]/g,"-").replace(/[,，\s円￥¥]/g,"");
  if(s===""||s==="-")return 0;
  return /^-?\d+$/.test(s)?Number(s):(fb||0);
}
/* 離乳日で日割単価を分割（離乳日当日までは離乳前単価、翌日から通常単価） */
function segRange(y,m,fromD,toD){return `${m}/${fromD}〜${m}/${toD}`}
function weanSegs(h,y,m){
  const total=calcD(h.entry,h.exit,y,m);
  if(total<=0)return[];
  const dim=dimM(y,m);
  /* 離乳日だけ入っていれば、離乳前単価はカテゴリ標準を自動適用 */
  let pre=Number(h.preWeanPrice||0);
  if(h.weanDate&&!pre){const d=CAT_P[h.cat];if(d&&d<h.price)pre=d}
  if(!h.weanDate||!pre||pre===h.price)return[{days:total,price:h.price,sub:""}];
  let preEnd=h.weanDate;
  if(h.exit&&new Date(h.exit)<new Date(h.weanDate))preEnd=h.exit;
  const pd=calcD(h.entry,preEnd,y,m);
  const post=total-pd;
  if(pd<=0||post<=0)return[{days:total,price:pd>0?pre:h.price,sub:""}];
  const wd=new Date(h.weanDate);
  const cut=(wd.getFullYear()===y&&wd.getMonth()+1===m)?wd.getDate():dim;
  const startD=Math.max(1,dim-total+1);
  const segs=[];
  segs.push({days:pd,price:pre,sub:segRange(y,m,startD,cut)});
  segs.push({days:post,price:h.price,sub:segRange(y,m,cut+1,startD+total-1)});
  return segs;
}
function horseAmt(h,y,m){return weanSegs(h,y,m).reduce((s,g)=>s+g.days*g.price,0)}

function Badge({cat}){
  const c=cat==="繁殖"?"badge-b":cat==="一才"?"badge-y":cat==="当歳"?"badge-f":"badge-e";
  return <span className={`inline-block px-2 py-0.5 text-xs font-medium rounded-full ${c}`}>{cat}</span>;
}

function calcMonthInv(horses,extras,y,m){
  const om={};
  horses.forEach(h=>{const amt=horseAmt(h,y,m);if(amt>0){if(!om[h.owner])om[h.owner]=0;om[h.owner]+=amt+Math.floor(amt*0.1)}});
  const ek=`${y}-${m}`;(extras[ek]||[]).forEach(e=>{if(!om[e.owner])om[e.owner]=0;if(e.taxIncluded){om[e.owner]+=e.amount}else{om[e.owner]+=e.amount+Math.floor(e.amount*0.1)}});
  return om;
}
/* 月別請求額の詳細版（税額分離） */
function calcMonthDetail(horses,extras,y,m){
  const om={};
  horses.forEach(h=>{const amt=horseAmt(h,y,m);if(amt>0){if(!om[h.owner])om[h.owner]={taxEx:0,taxInc:0};om[h.owner].taxEx+=amt;}});
  const ek=`${y}-${m}`;(extras[ek]||[]).forEach(e=>{if(!om[e.owner])om[e.owner]={taxEx:0,taxInc:0};if(e.taxIncluded)om[e.owner].taxInc+=e.amount;else om[e.owner].taxEx+=e.amount;});
  const res={};
  Object.entries(om).forEach(([ow,v])=>{
    const tax=Math.floor(v.taxEx*0.1);
    const incTax=v.taxInc-Math.floor(v.taxInc/1.1);
    res[ow]={sub:v.taxEx,tax:tax,taxIncTotal:v.taxInc,total:v.taxEx+tax+v.taxInc,taxTotal:tax+Math.round(incTax)};
  });
  return res;
}

/* ===== 音声入力ボタン ===== */
function MicBtn({onText,label}){
  const SR=typeof window!=="undefined"&&(window.SpeechRecognition||window.webkitSpeechRecognition);
  const[rec,setRec]=useState(false);
  const ref=React.useRef(null);
  if(!SR)return null;
  const stop=()=>{try{ref.current&&ref.current.stop()}catch(e){}setRec(false)};
  const start=()=>{
    if(rec){stop();return}
    const r=new SR();
    r.lang="ja-JP";r.interimResults=false;r.continuous=false;r.maxAlternatives=1;
    r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join("");if(t)onText(t)};
    r.onerror=e=>{setRec(false);if(e.error==="not-allowed")alert("マイクの使用が許可されていません。ブラウザの設定で許可してください。")};
    r.onend=()=>setRec(false);
    ref.current=r;
    try{r.start();setRec(true)}catch(e){setRec(false)}
  };
  return<button type="button" className="no-print" onClick={start} title={label||"音声入力"}
    style={{border:"1px solid "+(rec?"#dc2626":"#d1d5db"),background:rec?"#fee2e2":"#fff",color:rec?"#dc2626":"#6b7280",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap",lineHeight:1.6}}>
    {rec?"● 録音中 停止":"🎤 音声入力"}
  </button>;
}

/* 画像を縮小して保存容量を抑える（領収書写真の肥大化対策） */
function shrinkImg(dataUrl,maxPx,quality){
  return new Promise(function(res){
    try{
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,r=Math.min(1,maxPx/Math.max(w,h));
        var c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",quality||0.7));
      };
      img.onerror=function(){res(dataUrl)};
      img.src=dataUrl;
    }catch(e){res(dataUrl)}
  });
}

/* 指定年月の請求データを生成（画面表示・集計・一括印刷で共用） */
function buildInvoices(horses,extras,paidFlags,y,m){
  const om={};
  const eH=horses.filter(h=>!h.selfOwned&&!h.isShared);
  eH.forEach(h=>{
    const segs=weanSegs(h,y,m);
    if(segs.length){if(!om[h.owner])om[h.owner]=[];segs.forEach((g,gi)=>om[h.owner].push({name:h.name,sub:g.sub||"",cont:gi>0,cat:h.cat,days:g.days,price:g.price,amount:g.days*g.price,qty:g.days+" 日",unitPrice:g.price,taxIncluded:false,isExtra:false}))}
  });
  const ek=`${y}-${m}`;
  (extras[ek]||[]).forEach(e=>{if(!om[e.owner])om[e.owner]=[];om[e.owner].push({name:e.description,cat:"追加",days:0,price:0,amount:e.amount,qty:"1",unitPrice:e.taxIncluded?Math.floor(e.amount/1.1):e.amount,taxIncluded:e.taxIncluded,isExtra:true,isAdvance:!!e.isAdvance})});
  return Object.entries(om).sort(([a],[b])=>a.localeCompare(b)).map(([owner,items])=>{
    const taxable=items.filter(i=>!i.taxIncluded).reduce((s,i)=>s+i.amount,0);
    const taxOnTaxable=Math.floor(taxable*0.1);
    const taxIncTotal=items.filter(i=>i.taxIncluded).reduce((s,i)=>s+i.amount,0);
    const taxIncBase=items.filter(i=>i.taxIncluded).reduce((s,i)=>s+Math.floor(i.amount/1.1),0);
    const total=taxable+taxOnTaxable+taxIncTotal;
    let carry=0;
    for(let i=1;i<=12;i++){let py=y,pm=m-i;if(pm<=0){pm+=12;py--}const pKey=`${py}-${pm}`;const pInv=calcMonthInv(eH,extras,py,pm);if(pInv[owner]&&!(paidFlags[pKey]&&paidFlags[pKey][owner]))carry+=pInv[owner]}
    const paid=!!(paidFlags[`${y}-${m}`]&&paidFlags[`${y}-${m}`][owner]);
    return{owner,items,taxable,taxOnTaxable,taxIncTotal,taxIncBase,total,carry,paid,netBase:taxable+taxIncBase,taxTotal:taxOnTaxable+(taxIncTotal-taxIncBase)};
  });
}

/* 保存済みデータの補完：離乳日があるのに離乳前単価が未設定の馬に、カテゴリ標準単価を自動設定 */
function migrateHorses(hs){
  return hs.map(h=>{
    if(h.weanDate&&!(Number(h.preWeanPrice)>0)){
      const def=CAT_P[h.cat]||3000;
      if(def<Number(h.price))return{...h,preWeanPrice:def};
    }
    return h;
  });
}

  /* Google Apps Script でクラウド同期（JSONP読込 + fetch書込） */
  const gasUrl=syncUrl?syncUrl.replace(/\/$/, ""):"";

  /* クラウド保存（fetch mode:no-cors → 送信のみ確認不可） */
  const cloudSave=useCallback((data)=>{
    if(!gasUrl)return;
    setSyncStatus("保存中...");
    const body=JSON.stringify({...data,_ts:Date.now()});

    .then(()=>setSyncStatus("同期済 "+new Date().toLocaleTimeString()))
    .catch(err=>setSyncStatus("同期エラー: "+err.message));
  },[gasUrl]);

  /* クラウドから読込（JSONP方式 - CORS回避） */
  const cloudLoad=useCallback(()=>{
    if(!gasUrl)return Promise.resolve(null);
    return new Promise((resolve,reject)=>{
      const cbName="_hokuyo_cb_"+Date.now();
      const timeout=setTimeout(()=>{delete window[cbName];reject(new Error("タイムアウト"))},10000);

        clearTimeout(timeout);delete window[cbName];
        try{const s=document.querySelector("script[data-hokuyo-jsonp]");if(s)s.remove()}catch(e){}

      };
      const s=document.createElement("script");
      s.src=gasUrl+"?callback="+cbName;
      s.setAttribute("data-hokuyo-jsonp","1");
      s.onerror=function(){clearTimeout(timeout);delete window[cbName];s.remove();reject(new Error("読込失敗"))};
      document.head.appendChild(s);
    });
  },[gasUrl]);

  /* クラウドから読込（起動時） */
  useEffect(()=>{
    if(!gasUrl){cloudLoaded.current=true;return}
    setSyncStatus("読込中...");

            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
              <button className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg" onClick={()=>setAcModal(null)}>キャンセル</button>
              <button className="px-4 py-2 text-sm text-white rounded-lg" style={{background:acf.amount>0?"#2563eb":"#9ca3af"}} disabled={acf.amount<=0} onClick={()=>{
                const typeName=acf.type==="__custom"?acf.customType:acf.type;
                const cost={id:Date.now(),type:typeName,desc:acf.desc,amount:acf.amount,date:acf.date};
                const n={...advCosts};if(!n[h.id])n[h.id]=[];n[h.id]=[...n[h.id],cost];setAdvCosts(n);setAcModal(null);
              }}>追加</button>
            </div>
          </div>
        })()}
      </div></div>
    })()}
    {insModal&&<InsuranceModal horses={horses} onSave={ins=>setInsurances(p=>[...p,{...ins,id:Date.now()}])} onClose={()=>setInsModal(false)}/>}
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
